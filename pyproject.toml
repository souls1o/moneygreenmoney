[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betbetbet"
version = "1.0.0"
description = "Production Discord casino bot for Solana coinflip PvP"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "solana>=0.35.0",
    "solders>=0.21.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
betbetbet = "casino.__main__:main"
generate-house-wallet = "casino.tools.generate_house_wallet:main"
generate-super-wallet = "casino.tools.generate_super_wallet:main"
generate-deposit-master = "casino.tools.generate_deposit_master:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
